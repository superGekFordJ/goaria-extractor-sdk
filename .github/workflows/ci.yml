name: CI

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  test:
    name: Test & Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, windows-latest, macos-latest ]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: clippy, rustfmt

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      # zig 0.16.0 renamed tarballs to zig-<arch>-<os>-<ver>, which
      # setup-zig's mirror probing still requests under the old
      # zig-<os>-<arch>-<ver> name and 404s everywhere. Try community
      # mirrors first (ziglang.org's origin stalls on GH runners);
      # the pinned sha256 below makes mirror trust irrelevant.
      - name: Install Zig (Linux/macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          case "${{ runner.os }}" in
            Linux) pkg="zig-x86_64-linux-0.16.0"
                   sha="70e49664a74374b48b51e6f3fdfbf437f6395d42509050588bd49abe52ba3d00"
                   sum() { sha256sum -c; } ;;
            macOS) pkg="zig-aarch64-macos-0.16.0"
                   sha="b23d70deaa879b5c2d486ed3316f7eaa53e84acf6fc9cc747de152450d401489"
                   sum() { shasum -a 256 -c; } ;;
          esac
          ok=0
          for base in \
            "https://zig.linus.dev/zig" \
            "https://pkg.machengine.org/zig" \
            "https://zig.squirl.dev" \
            "https://ziglang.org/download"; do
            echo "Trying $base"
            if curl -fsSL --connect-timeout 10 --max-time 240 --retry 2 --retry-all-errors \
                 "$base/0.16.0/$pkg.tar.xz" -o zig.tar.xz; then
              ok=1; break
            fi
          done
          [ "$ok" = 1 ] || { echo "::error::all zig mirrors failed"; exit 1; }
          echo "$sha  zig.tar.xz" | sum
          sudo mkdir -p /opt/zig
          sudo tar -xJf zig.tar.xz -C /opt/zig --strip-components=1
          echo "/opt/zig" >> "$GITHUB_PATH"
          zig version

      - name: Install Zig (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $pkg = "zig-x86_64-windows-0.16.0"
          $ok = $false
          foreach ($base in @(
            "https://zig.linus.dev/zig",
            "https://pkg.machengine.org/zig",
            "https://zig.squirl.dev",
            "https://ziglang.org/download"
          )) {
            Write-Host "Trying $base"
            curl.exe -fsSL --connect-timeout 10 --max-time 240 --retry 2 --retry-all-errors `
              "$base/0.16.0/$pkg.zip" -o zig.zip
            if ($LASTEXITCODE -eq 0) { $ok = $true; break }
          }
          if (-not $ok) { throw "all zig mirrors failed" }
          $sha = (Get-FileHash zig.zip -Algorithm SHA256).Hash.ToLower()
          if ($sha -ne "68659eb5f1e4eb1437a722f1dd889c5a322c9954607f5edcf337bc3684a75a7e") {
            throw "zig tarball sha256 mismatch: $sha"
          }
          Expand-Archive zig.zip -DestinationPath C:\zig-dist
          echo "C:\zig-dist\$pkg" >> $env:GITHUB_PATH
          zig version

      - name: Check Rust formatting
        run: cargo fmt --check

      - name: Run Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Build Rust fixture pack for test suite
        run: cargo build -p rust_fixture_pack --target wasm32-unknown-unknown --release

      - name: Build Zig minimal pack example
        run: zig build --release=small
        working-directory: examples/zig_minimal_pack

      - name: Run Rust workspace unit and integration tests
        run: cargo test --workspace --all-targets

      - name: Run Zig SDK unit tests
        run: zig test sdk/zig/src/root.zig

      - name: Test CLI check on Rust fixture pack
        run: cargo run -p cargo-goaria-pack -- check --project-dir examples/rust_fixture_pack

      - name: Test CLI pack on Rust fixture pack
        run: cargo run -p cargo-goaria-pack -- pack --project-dir examples/rust_fixture_pack --out-dir dist

      - name: Test CLI check on Zig minimal pack
        run: cargo run -p cargo-goaria-pack -- check --project-dir examples/zig_minimal_pack

      - name: Test CLI pack on Zig minimal pack
        run: cargo run -p cargo-goaria-pack -- pack --project-dir examples/zig_minimal_pack --out-dir dist